name: corpo-news

services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-news}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB:-news}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', "pg_isready -U '$${POSTGRES_USER}' -d '$${POSTGRES_DB}'"]
            interval: 5s
            timeout: 5s
            retries: 12

    nats:
        image: nats:2.10-alpine
        restart: unless-stopped
        command: ['-js', '-sd', '/data', '-m', '8222']
        volumes:
            - nats_data:/data
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8222/healthz >/dev/null']
            interval: 5s
            timeout: 5s
            retries: 12

    backend:
        image: git.birlab.ru/birlab/corpo-news-hackaton/backend:${IMAGE_TAG:-local}
        build:
            context: ../corpo-news
            dockerfile: Dockerfile
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            nats:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-news}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-news}?schema=public
            NATS_URL: nats://nats:4222
            PORT: 3000
            NEWS_IMPORT_ENABLED: ${NEWS_IMPORT_ENABLED:-true}
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "const s=require('net').connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)",
                ]
            interval: 10s
            timeout: 3s
            retries: 12
            start_period: 60s

    ml-service:
        image: git.birlab.ru/birlab/corpo-news-hackaton/ml-service:${IMAGE_TAG:-local}
        build:
            context: ../ml-service
            dockerfile: Dockerfile
        restart: unless-stopped
        depends_on:
            nats:
                condition: service_healthy
            backend:
                condition: service_healthy
        environment:
            NATS_URL: nats://nats:4222
            HTTP_PROXY: ${LLM_HTTP_PROXY:-}
            HTTPS_PROXY: ${LLM_HTTPS_PROXY:-}
            NO_PROXY: localhost,127.0.0.1,nats,postgres,backend
            LLM_MODE: ${LLM_MODE:-llm}
            LLM_BASE_URL: ${LLM_BASE_URL:-https://changellenge.up.railway.app/v1}
            LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY}
            LLM_ENRICH_MODEL: ${LLM_ENRICH_MODEL:-qwen/qwen3.6-35b-a3b}
            LLM_SCORE_MODEL: ${LLM_SCORE_MODEL:-qwen/qwen3.6-35b-a3b}
            LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-qwen/qwen3.6-35b-a3b}
            LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
            LLM_JSON_MODE: ${LLM_JSON_MODE:-true}
            LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
            CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-1200}
            LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2500}
            LLM_MIN_INTERVAL: ${LLM_MIN_INTERVAL:-1}
            LLM_CONCURRENCY: ${LLM_CONCURRENCY:-2}
            SCORE_THRESHOLD: ${SCORE_THRESHOLD:-0.5}
            PREFILTER_MIN_HITS: ${PREFILTER_MIN_HITS:-1}
            NEWS_TEXT_LIMIT: ${NEWS_TEXT_LIMIT:-2500}
            RAG_ENABLED: ${RAG_ENABLED:-true}
            OCR_BACKEND: ${OCR_BACKEND:-vlm}
            LLM_OCR_MODEL: ${LLM_OCR_MODEL:-qwen/qwen3-vl-30b-a3b-instruct}
            OCR_CONCURRENCY: ${OCR_CONCURRENCY:-2}
            OCR_DPI: ${OCR_DPI:-150}
            RAG_MIN_SCORE: ${RAG_MIN_SCORE:-6.5}
            RAG_DIR: /app/data/alfa_pdfs
            BANK_CSV_DIR: /app/data/csv
        volumes:
            - ${BANK_CSV_HOST_DIR:-./data/csv}:/app/data/csv:ro
            - ${BANK_PDF_HOST_DIR:-./data/alfa_pdfs}:/app/data/alfa_pdfs:ro
            - rag_cache:/app/data/alfa_cache
            - bank_cache:/app/data/bank_cache

    proxy:
        image: git.birlab.ru/birlab/corpo-news-hackaton/web:${IMAGE_TAG:-local}
        build:
            context: ..
            dockerfile: deploy/Dockerfile.proxy
        restart: unless-stopped
        depends_on:
            backend:
                condition: service_healthy
        environment:
            BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Set BASIC_AUTH_USER}
            BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?Set BASIC_AUTH_HASH}
        networks:
            - default
            - dokploy-network
        labels:
            traefik.enable: 'true'
            traefik.docker.network: dokploy-network
            traefik.http.routers.corpo-news-http.rule: Host(`${PUBLIC_HOST:?Set PUBLIC_HOST}`)
            traefik.http.routers.corpo-news-http.entrypoints: web
            traefik.http.routers.corpo-news-http.middlewares: redirect-to-https@file
            traefik.http.routers.corpo-news.rule: Host(`${PUBLIC_HOST:?Set PUBLIC_HOST}`)
            traefik.http.routers.corpo-news.entrypoints: websecure
            traefik.http.routers.corpo-news.tls: 'true'
            traefik.http.routers.corpo-news.tls.certresolver: letsencrypt
            traefik.http.services.corpo-news.loadbalancer.server.port: '80'

volumes:
    postgres_data:
    nats_data:
    rag_cache:
    bank_cache:

networks:
    dokploy-network:
        external: true
